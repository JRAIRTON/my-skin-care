<title>MY Skin AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --surface-2: #F4F2EE;
  --ink: #1D1D1F;
  --ink-2: #4F4B45;
  --muted: #7C776F;
  --line: #E6E2DA;
  --gold: #B08D52;
  --gold-ink: #7F6231;
  --gold-soft: #F3ECDF;
  --on-gold: #FFFFFF;
  --good: #2F7D55;
  --good-soft: #E6F2EB;
  --warn: #9A6412;
  --warn-soft: #FBF0DC;
  --bad: #A63A33;
  --bad-soft: #F8E5E3;
  --shadow: 0 1px 2px rgba(29, 29, 31, .05), 0 8px 24px rgba(29, 29, 31, .05);
  --display: "Marcellus", "Cormorant Garamond", Georgia, serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111111;
    --surface: #1A1A1A;
    --surface-2: #222120;
    --ink: #EEEBE6;
    --ink-2: #C4BEB4;
    --muted: #938C82;
    --line: #2E2C29;
    --gold: #CFAE72;
    --gold-ink: #DDC18E;
    --gold-soft: #2A2419;
    --on-gold: #17130C;
    --good: #6CC495;
    --good-soft: #17271E;
    --warn: #E3AE55;
    --warn-soft: #2B2114;
    --bad: #E8847C;
    --bad-soft: #2E1A18;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111111;
  --surface: #1A1A1A;
  --surface-2: #222120;
  --ink: #EEEBE6;
  --ink-2: #C4BEB4;
  --muted: #938C82;
  --line: #2E2C29;
  --gold: #CFAE72;
  --gold-ink: #DDC18E;
  --gold-soft: #2A2419;
  --on-gold: #17130C;
  --good: #6CC495;
  --good-soft: #17271E;
  --warn: #E3AE55;
  --warn-soft: #2B2114;
  --bad: #E8847C;
  --bad-soft: #2E1A18;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 400; }
h1, h2 { font-family: var(--display); letter-spacing: .01em; }
h1 { font-size: 30px; line-height: 1.15; }
h2 { font-size: 23px; line-height: 1.2; }
h3 { font-family: var(--body); font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
a { color: var(--gold-ink); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1040px; margin: 0 auto; padding-inline: 16px; }
.brandrow { display: flex; align-items: center; gap: 12px; padding-block: 12px 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { flex: none; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 21px; letter-spacing: .02em; }
.brand b span { color: var(--gold-ink); }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.who select { min-width: 0; max-width: 58vw; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: none; padding: 7px 12px; border-radius: 999px; white-space: nowrap;
  color: var(--ink-2); font-weight: 500; font-size: 14px; cursor: pointer;
}
.tab:hover { background: var(--surface-2); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* Layout */
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; display: grid; gap: 16px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; background: transparent; border-style: dashed; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.lede { color: var(--ink-2); max-width: 62ch; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.divider { height: 1px; background: var(--line); }

/* Controls */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.btn.gold { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; padding-inline: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 6px 12px; font-size: 13px; }
label.f { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font-size: 15px; font-weight: 400;
}
textarea { resize: vertical; min-height: 70px; }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; flex-wrap: wrap; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.pill-check { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; font-weight: 500; }
.pill-check:has(input:checked) { border-color: var(--gold); background: var(--gold-soft); }
.pill-check input { accent-color: var(--gold); margin: 0; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.gold { background: var(--gold-soft); color: var(--gold-ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }

/* Notices */
.notice { display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px; font-size: 14px; background: var(--surface-2); color: var(--ink-2); align-items: flex-start; }
.notice .ico { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--ink-2); color: var(--surface); }
.notice.warn { background: var(--warn-soft); color: var(--ink); }
.notice.warn .ico { background: var(--warn); color: var(--surface); }
.notice.bad { background: var(--bad-soft); color: var(--ink); }
.notice.bad .ico { background: var(--bad); color: var(--surface); }
.notice ul { margin: 4px 0 0; padding-left: 18px; }

/* Score */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
@media (max-width: 480px) { .hero { grid-template-columns: 1fr; justify-items: start; } }
.ring-v { font-family: var(--mono); font-size: 34px; fill: var(--ink); font-weight: 500; }
.ring-l { font-size: 11px; fill: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.bars { display: grid; gap: 9px; }
.bar { display: grid; grid-template-columns: minmax(0, 11em) 1fr 2.6em; gap: 10px; align-items: center; font-size: 13.5px; }
.bar.wd { grid-template-columns: minmax(0, 11em) 1fr 2.6em 3.6em; }
.bar .lbl { color: var(--ink-2); overflow-wrap: anywhere; }
.bar .track { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar .fill { height: 100%; border-radius: 3px; background: var(--gold); }
.bar .v { text-align: right; }
.bar.na .v { color: var(--muted); }
.obs { font-size: 13px; color: var(--muted); grid-column: 1 / -1; margin-top: -4px; }
.delta { font-family: var(--mono); font-size: 12.5px; }
.delta.up { color: var(--good); }
.delta.down { color: var(--bad); }

/* Photos */
.photo { width: 100%; max-width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; background: var(--surface-2); display: block; }
.ph { width: 100%; aspect-ratio: 3 / 4; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); font-size: 13px; text-align: center; padding: 16px; }
.thumb { width: 56px; height: 72px; border-radius: 8px; object-fit: cover; background: var(--surface-2); flex: none; }
.thumb.ph { width: 56px; height: 72px; aspect-ratio: auto; padding: 4px; font-size: 10px; }
.drop {
  display: grid; place-items: center; gap: 8px; text-align: center; min-height: 190px; padding: 20px;
  border: 1.5px dashed var(--line); border-radius: 14px; cursor: pointer; background: var(--surface-2); color: var(--ink-2);
}
.drop:hover, .drop.over { border-color: var(--gold); background: var(--gold-soft); }
.drop strong { color: var(--ink); }
.preview { display: grid; grid-template-columns: minmax(0, 200px) 1fr; gap: 14px; align-items: start; }
@media (max-width: 480px) { .preview { grid-template-columns: 1fr; } }
.qlist { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.qlist li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; font-size: 14px; }
.qlist .tip { grid-column: 2 / -1; font-size: 12.5px; color: var(--muted); margin-top: -6px; }

.compare { position: relative; width: 100%; max-width: 420px; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.compare .after { clip-path: inset(0 0 0 var(--cut, 50%)); }
.compare .handle { position: absolute; top: 0; bottom: 0; left: var(--cut, 50%); width: 2px; background: var(--surface); box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
.compare .tag { position: absolute; top: 10px; padding: 2px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: rgba(0,0,0,.55); color: #fff; }
.compare .tag.l { left: 10px; } .compare .tag.r { right: 10px; }
input[type="range"] { width: 100%; max-width: 420px; accent-color: var(--gold); }

/* Lists */
.list { display: grid; gap: 0; }
.item { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.item:first-child { border-top: 0; }
.item:hover .item-t { color: var(--gold-ink); }
.item-b { flex: 1; min-width: 0; display: grid; gap: 2px; }
.item-t { font-weight: 600; }
.score-s { font-family: var(--mono); font-size: 22px; }

/* Chart */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.chart .ln { fill: none; stroke: var(--gold); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--gold); opacity: .12; }
.chart .pt { fill: var(--surface); stroke: var(--gold); stroke-width: 2; }
.chart .pt.end { fill: var(--gold); }
.chart .lab { fill: var(--ink); font-size: 12px; font-family: var(--mono); font-weight: 500; }
.chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.tip-box { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: 12.5px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
td.r, th.r { text-align: right; }

/* Routine */
.steps { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.step { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; }
.step input { width: 20px; height: 20px; accent-color: var(--gold); margin: 2px 0 0; }
.step.done .step-t { text-decoration: line-through; color: var(--muted); }
.step-t { font-weight: 600; }
.week { display: flex; gap: 6px; }
.day { display: grid; gap: 4px; justify-items: center; font-size: 11px; color: var(--muted); }
.day i { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: block; }
.day i.part { border-color: var(--gold); background: var(--gold-soft); }
.day i.full { border-color: var(--gold); background: var(--gold); }

/* Products */
.prod { display: grid; gap: 12px; }
.prod-h { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.prod-n { font-weight: 700; font-size: 16px; }
.split { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.box { border-radius: 10px; padding: 12px; display: grid; gap: 6px; font-size: 14px; }
.box.rec { background: var(--gold-soft); }
.box.price { background: var(--surface-2); }
.box h3 { font-size: 11.5px; }
.price-v { font-family: var(--mono); font-size: 19px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; background: var(--surface); color: var(--ink); }
.links a:hover { border-color: var(--gold); color: var(--gold-ink); }

/* Misc */
.busy { display: grid; gap: 8px; padding: 14px; border-radius: 12px; background: var(--gold-soft); }
.busy .bar-anim { height: 3px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); background-size: 200% 100%; animation: sweep 1.6s linear infinite; }
@keyframes sweep { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (prefers-reduced-motion: reduce) { .busy .bar-anim { animation: none; background: var(--gold); } }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.guide { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
.foot { font-size: 12.5px; color: var(--muted); text-align: center; padding-top: 8px; }
.empty { text-align: center; justify-items: center; padding-block: 36px; }
.empty p { max-width: 46ch; }

/* Etapa 1 */
.goals { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.goal { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.goal b { font-family: var(--mono); font-size: 22px; font-weight: 500; }
.slots { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.slot { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.slot .photo, .slot .ph { aspect-ratio: 3 / 4; }
.slot .drop { min-height: 0; aspect-ratio: 3 / 4; padding: 10px; font-size: 12.5px; }
.cell-ok { color: var(--good); font-weight: 600; }
.cell-warn { color: var(--warn); font-weight: 600; }
.cell-bad { color: var(--bad); font-weight: 600; }
.dist { display: grid; gap: 6px; }
.dist-row { display: grid; grid-template-columns: minmax(0, 12em) 1fr 2.4em; gap: 10px; align-items: center; font-size: 13.5px; }
.dist-row .track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.dist-row .fill { height: 100%; background: var(--gold); border-radius: 4px; }
.seg.small button { padding: 5px 10px; font-size: 12.5px; }
.q { display: grid; gap: 6px; }
.q > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.maps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.maps figure { margin: 0; display: grid; gap: 6px; }
.maps canvas { width: 100%; max-width: 100%; height: auto; border-radius: 10px; background: var(--surface-2); display: block; }
.maps figcaption { font-size: 13px; color: var(--ink-2); }
.chart .proc { stroke: var(--warn); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .proc-l { fill: var(--warn); font-size: 10.5px; font-family: var(--body); font-weight: 600; }
</style>

<div id="hdr"></div>
<main id="main" class="wrap"></main>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
"use strict";

  manchas: "manchas solares, melasma, marcas escuras pós-espinha e sardas",

const FOTO_TIPOS = { comum: "Luz comum (celular)", polarizada: "Luz polarizada", uv: "Luz UV" };
const QUIZ = [
  ["q1", "od", "Duas a três horas depois de lavar o rosto, sem produtos, a pele fica:", ["Repuxando ou áspera", "Confortável", "Com brilho só na zona T", "Com brilho no rosto todo"]],
  ["q2", "od", "Ao longo do dia, o protetor ou a maquiagem:", ["Racha ou marca as linhas", "Fica igual", "Some na zona T", "Some no rosto todo"]],
  ["q3", "sr", "Produtos novos causam ardor, coceira ou vermelhidão?", ["Nunca", "Raramente", "Às vezes", "Com frequência"]],

function classify(qz) {

  const ax = (k) => { const v = QUIZ.filter((q) => q[1] === k).map((q) => qz[q[0]]).filter((x) => x !== undefined && x !== ""); return v.length === 2 ? v.reduce((s, x) => s + Number(x), 0) : null; };
  const od = ax("od"), sr = ax("sr"), pn = ax("pn"), wt = ax("wt");
  if ([od, sr, pn, wt].some((v) => v == null)) return null;
  return {
    oleosidade: od <= 1 ? "Seca" : od <= 3 ? "Normal" : od === 4 ? "Mista" : "Oleosa",
    sensibilidade: sr >= 3 ? "Sensível" : "Resistente",
    pigmentacao: pn >= 3 ? "Com tendência a manchas" : "Sem tendência a manchas",
    envelhecimento: wt >= 3 ? "Maior risco de rugas" : "Menor risco de rugas",

  };
}

function upsertLocal(col, id, data) {
  if (col === "checks") { S.checks[id] = data; return; }
  const arr = S[col]; const i = arr.findIndex((x) => x.id === id); const row = { id, ...data };
  if (i >= 0) arr[i] = row; else arr.push(row);
}
async function putDoc(col, id, data) {
  if (S.db) await S.db.collection(col).doc(id).set(data);
  else { upsertLocal(col, id, data); onData(); }
}
async function patchDoc(col, id, patch) {
  if (S.db) await S.db.collection(col).doc(id).update(patch);
  else { const cur = S[col].find((x) => x.id === id); if (cur) { const { id: _, ...rest } = cur; upsertLocal(col, id, { ...rest, ...patch }); } onData(); }
}
async function delDoc(col, id) {
  if (S.db) await S.db.collection(col).doc(id).delete();
  else { if (col === "checks") delete S.checks[id]; else S[col] = S[col].filter((x) => x.id !== id); onData(); }
}

      try { const m = colorMaps(await createImageBitmap(f.blob)); if (m.pigPct != null) mapas = { pigmentoPct: +m.pigPct.toFixed(1), vermelhoPct: +m.redPct.toFixed(1), pelePct: +m.skinPct.toFixed(0) }; } catch {}
      const up = await S.assets.upload(f.blob, { type: "image/jpeg" });
      itens.push({ fotoId: up.id, ordem: i + 1, condicao: f.condicao || null, qualidade: f.q ? { level: f.q.level, medidas: f.q.medidas, items: f.q.items } : null, mapas });
    }
    const id = newId(), now = new Date().toISOString();
    if (tipo === "teste") await putDoc("testes", extra.testeId, { profileId: p.id, data: extra.data, analises: [], status: "aguardando", criadoEm: now });
    await putDoc("fila", id, { profileId: p.id, tipo, status: "pendente", itens, criadoEm: now, ...extra });
    stopBusy();
    return true;
  } catch (e) {
    stopBusy();
    for (const it of itens) S.assets.delete(it.fotoId).catch(() => {});
    if (e?.code !== "cancelled") toast("Não foi possível enviar as fotos. Tente de novo.");
    renderMain();
    return false;
  }
}
async function enqueueTest() {
  const td = S.testDraft, p = profile(td?.pid); if (!p || S.busy) return;
  const fotos = td.slots.filter((s) => s.blob);
  if (await enqueue(p, "teste", fotos, { testeId: newId(), data: today() })) {
    for (const s of td.slots) if (s.url) URL.revokeObjectURL(s.url);
    S.testDraft = null; toast("Fotos na fila. Agora peça a análise ao Claude Code."); renderMain();
  }
}
async function enqueueOne() {
  const d = S.draft, p = profile(d?.pid); if (!p || !d?.blob || S.busy) return;
  if (await enqueue(p, "analise", [{ blob: d.blob, q: d.q }], { data: d.data, regiao: d.regiao, tipoFoto: d.tipoFoto || "comum", contexto: d.ctx || {} })) {
    if (d.url) URL.revokeObjectURL(d.url);
    S.draft = null; toast("Foto na fila. Agora peça a análise ao Claude Code."); renderMain();
  }
}

  const all = analysesOf(p.id).filter((a) => !a.teste);

  if (!all.length && !evs.length) return `<section class="card empty"><h2>Sem histórico ainda</h2><p class="lede">A evolução aparece a partir da primeira análise de ${esc(p.nome)}.</p><div class="row"><button class="btn primary" data-act="tab:nova">Nova análise</button><button class="btn" data-act="proc-new">Registrar procedimento</button></div></section>${S.procForm ? `<section class="card">${procFormHtml()}</section>` : ""}`;

  const inPeriod = S.period === "tudo" ? valid : valid.filter((a) => daysBetween(a.data, lastDate) <= Number(S.period));
  const first = inPeriod[0], last = inPeriod[inPeriod.length - 1];
  const procIn = first && last ? eventsBetween(p.id, first.data, last.data) : [];
  const withPhoto = all.filter((a) => photoSrc(a));

      <tr><td><b>Skin Score</b></td><td class="r num">${first.skinScore}</td><td class="r num">${last.skinScore}</td><td class="r">${deltaHtml(last.skinScore, first.skinScore)}</td></tr>
      ${CATS.map(([k, l]) => { const a = catScore(first, k), b = catScore(last, k); return `<tr><td>${l}</td><td class="r num">${a ?? "—"}</td><td class="r num">${b ?? "—"}</td><td class="r">${deltaHtml(b, a) || "—"}</td></tr>`; }).join("")}
      ${first.mapas && last.mapas ? [["pigmentoPct", "Área com manchas (mapa)"], ["vermelhoPct", "Área avermelhada (mapa)"]].map(([k, l]) => { const a = first.mapas[k], b = last.mapas[k], dd = +(b - a).toFixed(1); return `<tr><td>${l}</td><td class="r num">${String(a).replace(".", ",")}%</td><td class="r num">${String(b).replace(".", ",")}%</td><td class="r"><span class="delta ${dd < 0 ? "up" : dd > 0 ? "down" : ""}">${dd > 0 ? "+" : ""}${String(dd).replace(".", ",")}</span></td></tr>`; }).join("") : ""}
    </tbody></table></div>
    <p class="small muted">Diferenças de até ${LIM_OK} pontos podem vir da luz ou do ângulo da foto, não da pele.</p>` : ""}
  </section>

    <div class="card">
      <h3>Antes e depois</h3>
      ${withPhoto.length >= 2 ? `<div class="fields">
        <label class="f" for="cmp-a">Antes<select id="cmp-a" data-cmp="a">${optList(S.cmp.a)}</select></label>
        <label class="f" for="cmp-b">Depois<select id="cmp-b" data-cmp="b">${optList(S.cmp.b)}</select></label>
      </div>
      <div class="compare" id="cmpbox" style="--cut:${S.cmp.cut}%"><img src="${esc(photoSrc(A))}" alt="Antes, ${fmt(A.data)}"><img class="after" src="${esc(photoSrc(B))}" alt="Depois, ${fmt(B.data)}"><span class="handle"></span><span class="tag l">${fmtS(A.data)}</span><span class="tag r">${fmtS(B.data)}</span></div>
      <label class="f" for="cmp-range">Arraste para comparar<input type="range" id="cmp-range" min="0" max="100" value="${S.cmp.cut}"></label>`
      : `<p class="muted">A comparação aparece quando houver duas ou mais análises com foto.</p>`}
    </div>
    <div class="card">
      <h3>Todas as análises</h3>
      ${all.length ? `<div class="list">${[...all].reverse().map((a) => `<button class="item" data-act="detail:${esc(a.id)}">${photoHtml(a, "thumb")}<span class="item-b"><span class="item-t">${fmt(a.data)}</span><span class="small muted">${REGIOES[a.regiao] || ""}${a.demo ? " · exemplo" : ""}${tipoFoto(a) !== "comum" ? " · " + FOTO_TIPOS[tipoFoto(a)].toLowerCase() : a.skinScore == null ? " · foto insuficiente" : ""}</span>${a.revisao ? `<span><span class="chip warn">Revisar</span></span>` : ""}</span><span class="score-s">${a.skinScore ?? "—"}</span></button>`).join("")}</div>` : `<p class="muted">Nenhuma análise ainda.</p>`}

  </section>`;

function drawChart() {
  const box = $("#chart"); if (!box) return;
  const p = profile(S.pid); if (!p) return;
  const valid = validOf(p.id);
  const lastDate = valid.length ? valid[valid.length - 1].data : today();
  const pts = (S.period === "tudo" ? valid : valid.filter((a) => daysBetween(a.data, lastDate) <= Number(S.period)))
    .map((a) => ({ t: dayMs(a.data), v: a.skinScore, d: a.data, id: a.id }));
  if (!pts.length) return;
  const W = Math.max(280, box.clientWidth || 600), H = 230, L = 34, R = 22, T = 26, B = 28;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, span = t1 - t0;
  const x = (t) => pts.length === 1 || !span ? L + (W - L - R) / 2 : L + ((t - t0) / span) * (W - L - R);
  const y = (v) => T + (1 - v / 100) * (H - T - B);
  const grid = [0, 25, 50, 75, 100].map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("");
  const xl = [pts[0], ...(pts.length > 2 ? [pts[Math.floor(pts.length / 2)]] : []), ...(pts.length > 1 ? [pts[pts.length - 1]] : [])]
    .map((q, i, arr) => `<text class="ax" x="${x(q.t)}" y="${H - 6}" text-anchor="${arr.length > 1 && i === 0 ? "start" : arr.length > 1 && i === arr.length - 1 ? "end" : "middle"}">${fmtS(q.d)}</text>`).join("");
  const procs = pts.length > 1 ? eventosOf(p.id).filter((e) => dayMs(e.data) >= t0 && dayMs(e.data) <= t1)
    .map((e) => `<line class="proc" x1="${x(dayMs(e.data))}" x2="${x(dayMs(e.data))}" y1="${T - 8}" y2="${H - B}"><title>${esc(e.tipo)} · ${fmt(e.data)}</title></line><text class="proc-l" x="${x(dayMs(e.data)) + 4}" y="${T - 10}">${esc(e.tipo.split(" ")[0])}</text>`).join("") : "";
  const line = pts.map((q, i) => `${i ? "L" : "M"}${x(q.t).toFixed(1)},${y(q.v).toFixed(1)}`).join(" ");
  const area = pts.length > 1 ? `<path class="ar" d="${line} L${x(pts[pts.length - 1].t).toFixed(1)},${y(0)} L${x(pts[0].t).toFixed(1)},${y(0)} Z"/>` : "";
  const end = pts[pts.length - 1];
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Skin Score ao longo do tempo">
    ${grid}${xl}${procs}${area}<path class="ln" d="${line}"/>
    <line class="cross" id="cross" y1="${T}" y2="${H - B}" x1="-10" x2="-10" visibility="hidden"/>
    ${pts.map((q, i) => `<circle class="pt${i === pts.length - 1 ? " end" : ""}" cx="${x(q.t)}" cy="${y(q.v)}" r="${i === pts.length - 1 ? 5.5 : 4.5}"/>`).join("")}
    <text class="lab" x="${x(end.t)}" y="${y(end.v) - 12}" text-anchor="${pts.length > 1 ? "end" : "middle"}">${end.v}</text>
  </svg><div class="tip-box" id="tip" hidden></div>`;
  const svg = box.querySelector("svg"), tip = $("#tip"), cross = $("#cross");
  const move = (ev) => {
    const r = svg.getBoundingClientRect(); const mx = ((ev.clientX - r.left) / r.width) * W;
    let best = pts[0]; for (const q of pts) if (Math.abs(x(q.t) - mx) < Math.abs(x(best.t) - mx)) best = q;
    cross.setAttribute("x1", x(best.t)); cross.setAttribute("x2", x(best.t)); cross.setAttribute("visibility", "visible");
    tip.hidden = false; tip.style.left = (x(best.t) / W) * r.width + "px"; tip.style.top = (y(best.v) / H) * r.height + "px";
    tip.textContent = `${fmt(best.d)} · Skin Score ${best.v}`;
  };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
}

function idadeHtml(p, a) {
  const ia = a?.resultado?.idade_aparente;
  if (!ia || p?.mostrarIdade === false) return "";
  const diff = p?.idade ? ia.estimativa - p.idade : null;
  const cmp = diff == null ? "" : Math.abs(diff) <= 3 ? "Dentro do esperado para a idade." : diff < 0 ? `Aparenta ${-diff} anos a menos que a idade real.` : `Aparenta ${diff} anos a mais que a idade real. Protetor solar todo dia é o que mais ajuda.`;
  return `<div class="stack"><div class="row" style="align-items:baseline"><span class="score-s">${ia.estimativa}</span><span class="muted small">anos (faixa de ${ia.min} a ${ia.max})${p?.idade ? ` · idade real ${p.idade}` : ""}</span></div>
    ${cmp ? `<p>${cmp}</p>` : ""}${ia.obs ? `<p class="small muted">${esc(ia.obs)}</p>` : ""}
    <p class="small muted">Estimativa visual da idade que a pele aparenta, com margem de alguns anos. Não é idade biológica, que depende de exames.</p></div>`;
}

function ingredientsHtml(r) {
  const ing = r.ingredientes || [];
  if (!ing.length) return `<p class="muted">—</p>`;
  return `<div class="list">${ing.map((g) => `<div class="item" style="cursor:default"><span class="item-b"><span class="item-t">${esc(g.nome)} ${g.faixa ? `<span class="chip">${esc(g.faixa)}</span>` : ""}</span><span class="small">${esc(g.para || "")}</span>${g.cuidado ? `<span class="small muted">Cuidado: ${esc(g.cuidado)}</span>` : ""}</span></div>`).join("")}</div>`;

// ----- Rotina
function vRotina() {
  const p = profile(S.pid);
  if (!p) return needProfile();
  const last = latest(p.id);
  const rot = last?.resultado?.rotina;
  if (!rot) return `<section class="card empty"><h2>Rotina ainda não definida</h2><p class="lede">A rotina de ${esc(p.nome)} é montada a partir da primeira análise válida.</p><button class="btn primary" data-act="tab:nova">Nova análise</button></section>`;
  const t = today();
  const rec = recoveryOn(p.id, t);
  const doc = S.checks[p.id] || { dias: {} };
  const done = new Set(doc.dias?.[t] || []);
  const daily = [...(rot.manha || []).map((_, i) => "m" + i), ...(rot.noite || []).map((_, i) => "n" + i)];
  const nDone = daily.filter((k) => done.has(k)).length;
  const week = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); const s = ymd(d); const n = daily.filter((k) => (doc.dias?.[s] || []).includes(k)).length; return { s, n, lbl: "DSTQQSS"[d.getDay()] }; });
  const block = (title, arr, pre, note) => `<div class="card"><div class="row between"><h3>${title}</h3>${note ? `<span class="small muted">${note}</span>` : ""}</div>${arr?.length ? `<ul class="steps">${arr.map((s, i) => { const k = pre + i; const on = done.has(k); return `<li class="step${on ? " done" : ""}"><input type="checkbox" id="st-${k}" data-act="chk:${k}"${on ? " checked" : ""}><label for="st-${k}"><span class="step-t">${esc(s.passo)}</span><br><span class="small">${esc(s.como || "")}</span>${s.por_que ? `<br><span class="small muted">${esc(s.por_que)}</span>` : ""}</label></li>`; }).join("")}</ul>` : `<p class="muted">—</p>`}</div>`;
  return `
  ${rec ? `<div class="notice bad"><span class="ico">!</span><div><b>Rotina em pausa parcial até ${fmt(addDays(rec.data, rec.dias || 14))}</b> por causa de ${esc(rec.tipo.toLowerCase())} em ${fmt(rec.data)}. Nesse período: limpeza suave, hidratante calmante e protetor solar. Suspenda ácidos, retinoides, vitamina C pura e esfoliação, a menos que o profissional oriente diferente.</div></div>` : ""}
  <section class="card">
    <div class="row between"><div class="stack"><h2>Rotina de ${esc(p.nome)}</h2><p class="small muted">Baseada na análise de ${fmt(last.data)}${last.demo ? " (exemplo)" : ""}. Marque os passos feitos hoje.</p></div>
    <div class="stack" style="justify-items:end"><span class="chip gold num">${nDone} de ${daily.length} hoje</span>
    <div class="week" aria-label="Últimos 7 dias">${week.map((w) => `<span class="day"><i class="${w.n === 0 ? "" : w.n >= daily.length ? "full" : "part"}" title="${fmt(w.s)}: ${w.n} de ${daily.length}"></i>${w.lbl}</span>`).join("")}</div></div></div>
  </section>
  <section class="grid2">
    ${block("Manhã", rot.manha, "m")}
    ${block("Noite", rot.noite, "n")}
  </section>
  ${rot.semanal?.length ? `<section class="grid2">${block("Uma ou duas vezes por semana", rot.semanal, "s", "não conta no progresso diário")}<div class="card"><h3>Ingredientes e cuidados</h3>${ingredientsHtml(last.resultado)}</div></section>` : `<section class="card"><h3>Ingredientes e cuidados</h3>${ingredientsHtml(last.resultado)}</section>`}
  <div class="notice"><span class="ico">i</span><div>Rotina educativa, gerada a partir de uma avaliação visual. Ao introduzir ativos novos, faça um de cada vez e teste antes numa pequena área. Pele sensível, gestação ou tratamentos em curso: confirme com um dermatologista.</div></div>`;
}

function toggleCheck(k) {
  const pid = S.pid; const t = today();
  const doc = JSON.parse(JSON.stringify(S.checks[pid] || { dias: {} }));
  doc.dias = doc.dias || {};
  const set = new Set(doc.dias[t] || []);
  set.has(k) ? set.delete(k) : set.add(k);
  doc.dias[t] = [...set];
  const cutS = addDays(t, -45);
  for (const d of Object.keys(doc.dias)) if (d < cutS) delete doc.dias[d];
  if (S.db) S.checks[pid] = doc;
  queued(() => putDoc("checks", pid, doc));
  renderMain();
}

const LOJAS = (q) => [
  ["Google Shopping", "https://www.google.com/search?tbm=shop&q=" + encodeURIComponent(q)],
  ["Mercado Livre", "https://lista.mercadolivre.com.br/" + encodeURIComponent(q.trim().replace(/\s+/g, "-"))],
  ["Amazon", "https://www.amazon.com.br/s?k=" + encodeURIComponent(q)],
  ["Zoom", "https://www.zoom.com.br/search?q=" + encodeURIComponent(q)],
];
function perUnit(pr) {
  const m = String(pr.unidade || "").match(/(\d+(?:[.,]\d+)?)\s*(ml|g)\b/i);
  if (!m || !Number.isFinite(pr.preco_min) || !Number.isFinite(pr.preco_max)) return "";

function testResult(t) {
  const as = (t.analises || []).map((id) => S.analyses.find((a) => a.id === id)).filter(Boolean);
  const same = as.filter((a) => a.teste?.condicao === "mesma" && a.skinScore != null);
  const diff = as.filter((a) => a.teste?.condicao === "diferente" && a.skinScore != null);
  const get = (a, k) => k === "skin" ? a.skinScore : catScore(a, k);
  const rows = [["skin", "Skin Score"], ...CATS].map(([k, l]) => {
    const sv = same.map((a) => get(a, k)).filter((v) => v != null);
    const dv = diff.map((a) => get(a, k)).filter((v) => v != null);
    const spread = sv.length >= 2 ? Math.max(...sv) - Math.min(...sv) : null;
    const luz = sv.length && dv.length ? Math.round(mean(dv) - mean(sv)) : null;
    return { k, l, sv, dv, spread, luz };
  });
  const skin = rows[0];
  const worst = rows.slice(1).filter((r) => r.spread != null).sort((a, b) => b.spread - a.spread)[0] || null;
  return { as, same, diff, rows, skin, worst, falhas: as.length - same.length - diff.length };
}

async function deleteTest(id) {
  const t = S.testes.find((x) => x.id === id); if (!t) return;
  try {
    for (const aid of t.analises || []) await deleteAnalysis(aid);
    for (const f of S.fila.filter((x) => x.testeId === id)) {
      for (const it of f.itens || []) if (it.fotoId && S.assets) await S.assets.delete(it.fotoId).catch(() => {});

    await delDoc("testes", id);
    toast("Teste excluído.");
  } catch { toast("Não foi possível excluir o teste. Tente de novo."); }

}

// ---------- Image processing & quality ----------
async function decode(file) {
  try { return await createImageBitmap(file, { imageOrientation: "from-image" }); } catch {}
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode(); return img;
  } finally { URL.revokeObjectURL(url); }
}

async function processImage(file) {
  const bmp = await decode(file);
  const W = bmp.width, H = bmp.height;
  const sc = Math.min(1, 1600 / Math.max(W, H));
  const cv = document.createElement("canvas"); cv.width = Math.round(W * sc); cv.height = Math.round(H * sc);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  const blob = await new Promise((r) => cv.toBlob(r, "image/jpeg", 0.88));
  const ms = Math.min(1, 384 / Math.max(W, H));
  const m = document.createElement("canvas"); m.width = Math.max(8, Math.round(W * ms)); m.height = Math.max(8, Math.round(H * ms));
  const mx = m.getContext("2d", { willReadFrequently: true }); mx.drawImage(bmp, 0, 0, m.width, m.height);
  const { data } = mx.getImageData(0, 0, m.width, m.height);
  return { blob, url: URL.createObjectURL(blob), q: measure(data, m.width, m.height, W, H) };
}

function measure(px, w, h, W, H) {
  const lum = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) lum[i] = 0.2126 * px[i * 4] + 0.7152 * px[i * 4 + 1] + 0.0722 * px[i * 4 + 2];
  // central region, where the face usually is
  const x0 = Math.floor(w * .25), x1 = Math.floor(w * .75), y0 = Math.floor(h * .2), y1 = Math.floor(h * .8);
  let sum = 0, n = 0, hi = 0, lo = 0, rs = 0, bs = 0, left = 0, right = 0, nl = 0, nr = 0;
  const xm = (x0 + x1) / 2;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const i = y * w + x, L = lum[i]; sum += L; n++;
    if (L >= 250) hi++; if (L <= 8) lo++;
    rs += px[i * 4]; bs += px[i * 4 + 2];
    if (x < xm) { left += L; nl++; } else { right += L; nr++; }
  }
  const avg = sum / n, hiPct = (hi / n) * 100, loPct = (lo / n) * 100;
  const side = Math.abs(left / nl - right / nr);
  const rb = (rs / n) / Math.max(1, bs / n);
  // sharpness: variance of Laplacian
  let ls = 0, ls2 = 0, ln = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    const v = lum[i - w] + lum[i + w] + lum[i - 1] + lum[i + 1] - 4 * lum[i];
    ls += v; ls2 += v * v; ln++;
  }
  const lap = ls2 / ln - (ls / ln) ** 2;
  const minSide = Math.min(W, H);
  const items = [
    { k: "Resolução", v: `${W}×${H}`, s: minSide < 480 ? "bad" : minSide < 900 ? "warn" : "ok", tip: "Peça a foto original, enviada como documento." },
    { k: "Iluminação", v: `${Math.round(avg)}/255`, s: avg < 55 || avg > 225 ? "bad" : avg < 85 || avg > 200 ? "warn" : "ok", tip: avg < 85 ? "Foto escura. Peça uma foto de frente para a janela, de dia." : "Foto clara demais. Evite sol direto e flash." },
    { k: "Áreas estouradas", v: `${hiPct.toFixed(1)}%`, s: hiPct > 12 ? "bad" : hiPct > 4 ? "warn" : "ok", tip: "Reflexo forte ou flash apagando a textura da pele." },
    { k: "Sombra lateral", v: `${Math.round(side)}`, s: side > 55 ? "bad" : side > 30 ? "warn" : "ok", tip: "Um lado do rosto mais escuro. A luz deve vir de frente." },
    { k: "Nitidez (estimada)", v: `${Math.round(lap)}`, s: lap < 12 ? "bad" : lap < 35 ? "warn" : "ok", tip: "Foto tremida ou fora de foco. Apoie o celular e toque no rosto para focar." },
    { k: "Cor da luz", v: rb < 0.95 ? "fria" : rb > 2.1 ? "quente" : "neutra", s: rb < 0.9 || rb > 2.4 ? "warn" : "ok", tip: "Luz muito azulada ou amarelada altera a leitura de manchas e vermelhidão." },
  ];
  if (loPct > 25) items.push({ k: "Áreas muito escuras", v: `${loPct.toFixed(0)}%`, s: "warn", tip: "Parte do rosto sem luz." });
  const lvl = items.some((i) => i.s === "bad") ? "bad" : items.filter((i) => i.s === "warn").length ? "warn" : "ok";
  return { items, level: lvl, medidas: { brilho: Math.round(avg), estourado: +hiPct.toFixed(1), sombra: Math.round(side), nitidez: Math.round(lap), corRB: +rb.toFixed(2), largura: W, altura: H } };
}

// Color maps from an ordinary photo. Melanin and erythema indices follow the reflectance
// approximations used by skin colorimeters (MI = log 1/R, EI = log 1/G - log 1/R).
// Experimental: lighting shifts the absolute values, so compare photos taken the same way.
function colorMaps(img, maxSide = 480) {
  const W0 = img.naturalWidth || img.width, H0 = img.naturalHeight || img.height;
  const sc = Math.min(1, maxSide / Math.max(W0, H0));
  const w = Math.max(8, Math.round(W0 * sc)), h = Math.max(8, Math.round(H0 * sc)), n = w * h;
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const cx = cv.getContext("2d", { willReadFrequently: true }); cx.drawImage(img, 0, 0, w, h);
  const px = cx.getImageData(0, 0, w, h).data;
  const skin = new Uint8Array(n), mi = new Float32Array(n), ei = new Float32Array(n), gray = new Uint8ClampedArray(n);
  let ns = 0, e1 = 0;
  for (let i = 0; i < n; i++) {
    const r = Math.max(px[i * 4], 1), g = Math.max(px[i * 4 + 1], 1), b = px[i * 4 + 2];
    const Y = 0.299 * r + 0.587 * g + 0.114 * b; gray[i] = Y;
    const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b, cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
    mi[i] = Math.log10(255 / r); ei[i] = Math.log10(255 / g) - Math.log10(255 / r);
    if (cb >= 77 && cb <= 127 && cr >= 133 && cr <= 185 && Y > 40 && Y < 245) { skin[i] = 1; ns++; e1 += ei[i]; }
  }
  const out = { w, h, gray, pig: null, red: null, pigPct: null, redPct: null, skinPct: (ns / n) * 100 };
  if (ns < n * 0.03) return out;
  // Local mean of the melanin index over skin pixels (integral images), so spots stand out from the base tone.
  const W1 = w + 1, SI = new Float64Array(W1 * (h + 1)), CI = new Float64Array(W1 * (h + 1));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, k = (y + 1) * W1 + x + 1;
    SI[k] = SI[k - 1] + SI[k - W1] - SI[k - W1 - 1] + (skin[i] ? mi[i] : 0);
    CI[k] = CI[k - 1] + CI[k - W1] - CI[k - W1 - 1] + skin[i];
  }
  const rad = Math.max(4, Math.round(Math.max(w, h) / 24)), mE = e1 / ns;
  const pig = new Uint8ClampedArray(n), red = new Uint8ClampedArray(n);
  let np = 0, nr = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; if (!skin[i]) continue;
    const xa = Math.max(0, x - rad), xb = Math.min(w, x + rad + 1), ya = Math.max(0, y - rad), yb = Math.min(h, y + rad + 1);
    const sum = SI[yb * W1 + xb] - SI[ya * W1 + xb] - SI[yb * W1 + xa] + SI[ya * W1 + xa];
    const cnt = CI[yb * W1 + xb] - CI[ya * W1 + xb] - CI[yb * W1 + xa] + CI[ya * W1 + xa];
    const dp = mi[i] - sum / cnt;
    if (dp > 0.035) { pig[i] = 70 + clamp((dp - 0.035) / 0.06, 0, 1) * 185; np++; continue; }
    // Brown spots also raise the erythema index in RGB, so a pixel counts as red only if it is not a spot.
    const dr = ei[i] - mE;
    if (dr > 0.06) { red[i] = 70 + clamp((dr - 0.06) / 0.08, 0, 1) * 185; nr++; }
  }
  return { ...out, pig, red, pigPct: (np / ns) * 100, redPct: (nr / ns) * 100 };
}

const mapCache = {};
async function drawMaps(src) {
  const box = $("#maps"); if (!box) return;
  let m = mapCache[src];
  if (!m) {
    try { const img = new Image(); img.src = src; await img.decode(); m = mapCache[src] = colorMaps(img); }
    catch { box.innerHTML = `<p class="muted small">Não foi possível gerar os mapas desta foto.</p>`; return; }
  }
  if (!m.pig) { box.innerHTML = `<p class="muted small">Pouca pele detectada na foto para gerar os mapas.</p>`; return; }
  const paint = (id, layer, [cr, cg, cb]) => {
    const c = document.getElementById(id); if (!c) return;
    c.width = m.w; c.height = m.h;
    const ctx = c.getContext("2d"), im = ctx.createImageData(m.w, m.h), o = im.data;
    for (let i = 0; i < m.w * m.h; i++) {
      const base = 150 + m.gray[i] * 0.4, a = layer[i] / 255;
      o[i * 4] = base * (1 - a) + cr * a; o[i * 4 + 1] = base * (1 - a) + cg * a; o[i * 4 + 2] = base * (1 - a) + cb * a; o[i * 4 + 3] = 255;
    }
    ctx.putImageData(im, 0, 0);
  };
  paint("map-pig", m.pig, [110, 62, 18]);
  paint("map-red", m.red, [214, 38, 48]);
  const a = $("#pig-pct"), b = $("#red-pct");
  if (a) a.textContent = m.pigPct.toFixed(1).replace(".", ",") + "% da pele";
  if (b) b.textContent = m.redPct.toFixed(1).replace(".", ",") + "% da pele";
}

function checkFile(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { toast("Use uma foto JPG, PNG ou WebP. Fotos HEIC do iPhone: envie como JPG."); return false; }
  if (file.size > 20 * 1024 * 1024) { toast(ERR.image_too_big); return false; }
  return true;
}

async function onFile(file) {
  if (!file || !checkFile(file)) return;
  const d = ensureDraft();
  try {
    const r = await processImage(file);
    if (d.url) URL.revokeObjectURL(d.url);
    Object.assign(d, r, { force: false });
  } catch { toast("Não foi possível abrir esta imagem."); }
  renderMain();
}

async function onSlotFiles(files, startIdx) {
  const td = S.testDraft; if (!td) return;
  let i = startIdx;
  for (const file of files) {
    if (!checkFile(file)) continue;
    if (startIdx == null) { i = td.slots.findIndex((s) => !s.blob); if (i < 0) { td.slots.push({ condicao: "mesma" }); i = td.slots.length - 1; } }
    try {
      const r = await processImage(file);
      if (td.slots[i].url) URL.revokeObjectURL(td.slots[i].url);
      Object.assign(td.slots[i], r);
    } catch { toast("Não foi possível abrir uma das imagens."); }
    if (startIdx != null) break;
  }
  renderMain();
}

// ---------- AI analysis ----------
function buildPrompt(p, d, prev, prevHasImage, isTest) {
  const ctx = Object.entries(d.ctx || {}).filter(([, v]) => v).map(([k, v]) => `${k}: ${v}`).join("; ") || "não informado";
  const prevNotes = prev ? CATS.map(([k, l]) => `${l} ${catScore(prev, k) ?? "—"}`).join(", ") : "";
  const evs = eventosOf(p.id).filter((e) => e.data <= d.data && e.data >= addDays(d.data, -180));
  const quiz = classify(p.quest);
  const tf = d.tipoFoto || "comum";
  const tipoTxt = {
    comum: "Foto comum de celular. Porfirinas e pigmento profundo NÃO podem ser avaliados nela: use \"achados_especiais\": null.",
    polarizada: "Foto com luz polarizada cruzada: o reflexo da superfície é removido e pigmento e vasos sob a pele ficam realçados. Brilho, oleosidade, poros e textura de superfície não podem ser avaliados (use null). Preencha \"achados_especiais\".",
    uv: "Foto sob luz ultravioleta (lâmpada de Wood ou lente UV). Porfirinas aparecem como pontos laranja-avermelhados fluorescentes nos poros; manchas da epiderme ficam mais contrastadas. Avalie só manchas e poros (demais notas null) e preencha \"achados_especiais\". Idade aparente: null.",
  }[tf];
  const procTxt = evs.length ? evs.map((e) => `${e.tipo} em ${fmt(e.data)}${e.area ? " (" + e.area + ")" : ""}, recuperação estimada de ${e.dias || 14} dias`).join("; ") : (p.procRecente ? "a pessoa informou procedimento estético nos últimos 6 meses, sem detalhes" : "nenhum registrado");
  return `Você é o motor de avaliação visual do protótipo MY Skin AI, um app de cuidados com a pele (uso cosmético, NÃO é diagnóstico médico). Responda em português do Brasil.

IMAGEM 1: foto atual, região "${REGIOES[d.regiao]}", tirada em ${fmt(d.data)}. ${tipoTxt}${prevHasImage ? `
IMAGEM 2: foto anterior da mesma região, tirada em ${fmt(prev.data)}, que está no cadastro da mesma pessoa.` : ""}

PERFIL: idade ${p.idade || "não informada"}; tipo de pele percebido: ${p.tipoPele || "não sei"}; questionário de tipo de pele: ${quiz ? `${quiz.oleosidade}, ${quiz.sensibilidade}, ${quiz.pigmentacao}, ${quiz.envelhecimento}` : "não respondido"}; fototipo: ${p.fototipo || "não informado"}; objetivos: ${(p.objetivos || []).join(", ") || "não informados"}; observações: ${p.obs || "nenhuma"}.
PROCEDIMENTOS ESTÉTICOS RECENTES: ${procTxt}.
CONTEXTO DO DIA: ${ctx}.
QUALIDADE MEDIDA NA FOTO (métricas automáticas): ${JSON.stringify(d.q?.medidas || {})}.
${isTest ? "Esta análise faz parte de um teste de repetição: avalie SOMENTE esta foto, de forma independente." : prev ? `ANÁLISE ANTERIOR (${fmt(prev.data)}): ${prevNotes}.` : "Esta é a primeira análise desta pessoa."}

O QUE CADA NOTA AVALIA:
${CATS.map(([k, l]) => `- ${k} (${l}): ${CAT_DEF[k]}`).join("\n")}

ESCALA DAS NOTAS (0 a 100, sempre "maior = aparência melhor" naquela categoria):
90-100 quase nenhum sinal visível; 75-89 sinais leves; 60-74 moderados; 40-59 evidentes; abaixo de 40 muito evidentes.
Em poros, linhas, manchas, vermelhidão e oleosidade, nota alta significa POUCO sinal. Não ajuste a escala pela idade; a idade serve só para contextualizar o texto. Use null quando a categoria não puder ser avaliada nesta foto.
CONSISTÊNCIA: seja conservador. Diferença de luz, ângulo ou distância não é mudança da pele.${prev && !isTest ? " Só altere uma nota em mais de 5 pontos em relação à análise anterior se a mudança for claramente visível apesar dessas diferenças." : ""}
PROCEDIMENTOS: se houver procedimento recente, considere que vermelhidão, inchaço ou descamação podem ser temporários, e não atribua ao cuidado diário mudanças que venham do procedimento. Durante a recuperação, a rotina deve ser só limpeza suave, hidratante calmante e protetor solar, sem ácidos, retinoides ou esfoliação.${prevHasImage ? `
VERIFICAÇÃO: compare a IMAGEM 1 com a IMAGEM 2 apenas para dizer se parecem ser a mesma pessoa. Não diga quem é. Lembre que luz, maquiagem, cabelo e procedimentos mudam a aparência. Responda em "mesma_pessoa" com "sim", "nao" ou "incerto".` : ""}

REGRAS:
- Se a imagem não mostrar um rosto humano, ou a qualidade não permitir avaliar, use "qualidade_suficiente": false, todas as notas null, e explique em "problemas_foto".
- Aponte sinais de filtro, "modo beleza" ou edição em "filtro_suspeito". Se parecer foto de uma tela ou de outra foto, diga em "problemas_foto".
- Não identifique a pessoa. Não nomeie doenças como certeza; use "aparência de".
- TIPO DE PELE PELA FOTO: classifique o que se vê (oleosidade, sinais de sensibilidade, tendência a manchas, sinais de envelhecimento). É uma estimativa visual; se o questionário divergir, diga em "obs".
- IDADE APARENTE DA PELE: estime a idade que a pele aparenta pela foto, com uma faixa de pelo menos 6 anos, e diga o que mais pesou. É idade aparente, não idade biológica. Use null se a foto não permitir.
- Em "alertas", só quando houver algo que mereça dermatologista: pinta irregular ou que parece ter mudado, ferida que não cicatriza, lesão que sangra, inflamação intensa, acne nodular ou cística, descamação extensa. Caso contrário, lista vazia.
- Não recomende medicamentos de prescrição (tretinoína, isotretinoína, hidroquinona, antibióticos, corticoides). Se parecer indicado, diga para conversar com um dermatologista.
- Rotina simples: até 4 passos de manhã e até 4 à noite, com protetor solar de manhã. Não combine retinoide com ácidos esfoliantes na mesma noite. Respeite as observações do perfil (gestação, alergias).
- Produtos: 4 a 6 itens de marcas vendidas no Brasil, ligados à rotina. Preço em reais é uma ESTIMATIVA do varejo brasileiro atual; dê a faixa (preco_min, preco_max) e o tamanho da embalagem. Inclua uma alternativa mais barata com ingrediente equivalente.

function normalize(res) {
  if (!res || typeof res !== "object") throw { code: "invalid_json" };
  res.notas = res.notas && typeof res.notas === "object" ? res.notas : {};
  for (const [k] of CATS) {
    const n = res.notas[k] || {};
    const v = Number(n.nota);
    res.notas[k] = { nota: n.nota == null || !Number.isFinite(v) ? null : Math.round(clamp(v, 0, 100)), obs: n.obs ? String(n.obs) : "" };
  }
  if (res.qualidade_suficiente === false) for (const [k] of CATS) res.notas[k].nota = null;
  for (const k of ["problemas_foto", "pontos_fortes", "pontos_atencao", "alertas", "ingredientes", "produtos"]) if (!Array.isArray(res[k])) res[k] = [];
  res.produtos = res.produtos.map((p) => ({ ...p, preco_min: Number.isFinite(Number(p.preco_min)) ? Number(p.preco_min) : null, preco_max: Number.isFinite(Number(p.preco_max)) ? Number(p.preco_max) : null }));
  res.confianca = String(res.confianca || "").toLowerCase().replace("é", "e");
  const tv = res.tipo_pele_visual;
  res.tipo_pele_visual = tv && typeof tv === "object" ? Object.fromEntries(["oleosidade", "sensibilidade", "pigmentacao", "envelhecimento", "obs"].map((k) => [k, tv[k] ? String(tv[k]) : ""])) : null;
  const ia = res.idade_aparente;
  const est = Number(ia?.estimativa);
  res.idade_aparente = ia && Number.isFinite(est) ? { estimativa: Math.round(est), min: Math.round(Number(ia.min) || est - 3), max: Math.round(Number(ia.max) || est + 3), obs: ia.obs ? String(ia.obs) : "" } : null;
  const ae = res.achados_especiais;
  res.achados_especiais = ae && typeof ae === "object" ? Object.fromEntries(["porfirinas", "pigmento_profundo", "vascular", "obs"].map((k) => [k, ae[k] ? String(ae[k]) : ""])) : null;
  const mp = String(res.mesma_pessoa || "").toLowerCase().replace("ã", "a");
  res.mesma_pessoa = ["sim", "nao", "incerto"].includes(mp) ? mp : null;
  return res;
}

// One photo -> Claude -> saved analysis document. Throws a sample error on failure.
async function runAnalysis(p, d, { prev = null, teste = null, signal, onProgress } = {}) {
  const tf = d.tipoFoto || "comum";
  if (tf !== "comum") prev = null;
  const images = [d.blob];
  let prevHasImage = false;
  if (!teste && prev?.fotoId && (S.imgMax == null || S.imgMax >= 2)) {
    try { const r = await fetch("/_blob/" + prev.fotoId); if (r.ok) { images.push(await r.blob()); prevHasImage = true; } } catch {}
  }
  const ask = (withPrev) => S.sample.json(buildPrompt(p, d, teste ? null : prev, withPrev, !!teste), {
    images: withPrev ? images : [d.blob], signal, modelTier: "default", onText: onProgress,
  });
  let raw;
  try { raw = await ask(prevHasImage); }
  catch (e) {
    // A comparison between two faces can be declined; retry once with the current photo only.
    if ((e?.code === "refused" || e?.code === "image_rejected") && prevHasImage) { prevHasImage = false; raw = await ask(false); }
    else throw e;
  }
  const res = normalize(raw);
  if (!prevHasImage) res.mesma_pessoa = null;
  const id = newId();
  let fotoId = null;
  if (S.assets) {
    try { fotoId = (await S.assets.upload(d.blob, { type: "image/jpeg" })).id; }
    catch { toast("A foto não pôde ser guardada. A análise foi salva sem ela."); }
  } else localUrls[id] = URL.createObjectURL(d.blob);
  // Special-light photos read a different signal; they never produce a Skin Score.
  const skinScore = tf === "comum" ? computeScore(res) : null;
  let mapas = null;
  if (tf === "comum") {
    try { const bmp = await createImageBitmap(d.blob); const m = colorMaps(bmp); if (m.pigPct != null) mapas = { pigmentoPct: +m.pigPct.toFixed(1), vermelhoPct: +m.redPct.toFixed(1), pelePct: +m.skinPct.toFixed(0) }; } catch {}
  }
  let revisao = null;
  if (!teste && skinScore != null) {
    if (res.mesma_pessoa === "nao" || res.mesma_pessoa === "incerto") {
      revisao = { tipo: "pessoa", motivo: res.mesma_pessoa === "nao" ? `A IA achou que a foto não parece ser da mesma pessoa da análise de ${fmt(prev.data)}.` : `A IA não teve certeza de que é a mesma pessoa da análise de ${fmt(prev.data)}.` };
    } else if (prev && !eventsBetween(p.id, prev.data, d.data).length) {
      const ds = skinScore - prev.skinScore;
      const cat = CATS.map(([k, l]) => [l, catScore({ resultado: res }, k), catScore(prev, k)]).filter(([, a, b]) => a != null && b != null).map(([l, a, b]) => [l, a - b]).sort((x, y) => Math.abs(y[1]) - Math.abs(x[1]))[0];
      if (Math.abs(ds) > SALTO_SCORE) revisao = { tipo: "salto", motivo: `O Skin Score mudou ${ds > 0 ? "+" : ""}${ds} pontos desde ${fmt(prev.data)}. Pode ser foto de outra pessoa, luz muito diferente ou um procedimento não registrado.` };
      else if (cat && Math.abs(cat[1]) > SALTO_CAT) revisao = { tipo: "salto", motivo: `${cat[0]} mudou ${cat[1] > 0 ? "+" : ""}${cat[1]} pontos desde ${fmt(prev.data)}. Confira luz, ângulo ou procedimento não registrado.` };
    }
  }
  const doc = {
    profileId: p.id, data: d.data, regiao: d.regiao, tipoFoto: tf, fotoId,
    qualidade: d.q, contexto: d.ctx || {}, resultado: res, skinScore, mapas,
    comparadoCom: teste ? null : prev?.id || null, revisao, teste,
    criadoEm: new Date().toISOString(),
  };
  await putDoc("analyses", id, doc);
  if (revisao) logOcorrencia(p.id, "revisão", revisao.motivo);
  if (skinScore == null && tf === "comum") logOcorrencia(p.id, "foto insuficiente", (res.problemas_foto || []).join("; ") || "sem motivo informado");
  return { id, doc };
}

function startBusy(msg) {
  const ctl = new AbortController();
  S.busy = { ctl, msg, secs: 0, timer: setInterval(() => { if (S.busy) { S.busy.secs++; updateBusy(); } }, 1000) };
  return ctl;
}
function stopBusy() { clearInterval(S.busy?.timer); S.busy = null; }

async function analisar() {
  const d = S.draft, p = profile(d?.pid);
  if (!d?.blob || !p || !S.sample || S.busy) return;
  const prior = validOf(p.id).filter((a) => a.regiao === d.regiao && a.data <= d.data);
  const prev = prior[prior.length - 1] || null;
  if (d.q?.level === "bad") logOcorrencia(p.id, "foto ruim analisada", d.q.items.filter((i) => i.s === "bad").map((i) => i.k).join(", "));
  const ctl = startBusy("Enviando foto e aguardando o Claude…");
  renderMain();
  try {
    const { id } = await runAnalysis(p, d, {
      prev, signal: ctl.signal,
      onProgress: () => { if (S.busy && S.busy.msg[0] !== "R") { S.busy.msg = "Recebendo o resultado…"; updateBusy(); } },
    });
    stopBusy();
    if (d.url) URL.revokeObjectURL(d.url);
    S.draft = null; S.detailId = id; S.tab = "detalhe"; S.confirm = null;
    window.scrollTo({ top: 0 });
    render();
  } catch (e) {
    stopBusy(); renderMain();
    if (e?.code !== "cancelled") { toast(ERR[e?.code] || "Falha temporária na análise. Tente de novo."); logOcorrencia(p.id, "erro na análise", `${e?.code || "erro"}: ${e?.message || ""}`); }
  }
}

async function runTest() {
  const td = S.testDraft, p = profile(td?.pid);
  if (!td || !p || !S.sample || S.busy) return;
  const slots = td.slots.filter((s) => s.blob);
  const testId = newId();
  const ctl = startBusy(`Foto 1 de ${slots.length}…`);
  renderMain();
  const ids = [];
  let status = "concluido";
  const data = today();
  for (let i = 0; i < slots.length; i++) {
    if (ctl.signal.aborted) { status = "incompleto"; break; }
    S.busy.msg = `Analisando foto ${i + 1} de ${slots.length}…`; updateBusy();
    const s = slots[i];
    try {
      const { id } = await runAnalysis(p, { data, regiao: "frontal", blob: s.blob, q: s.q, ctx: {} }, { teste: { id: testId, condicao: s.condicao, ordem: i + 1 }, signal: ctl.signal });
      ids.push(id);
    } catch (e) {
      if (e?.code === "cancelled") { status = "incompleto"; break; }
      status = "incompleto";
      logOcorrencia(p.id, "erro no teste", `foto ${i + 1}: ${e?.code || "erro"}`);
      if (["not_granted", "sampling_disabled", "rate_limited", "session_expired", "images_unavailable"].includes(e?.code)) { toast(ERR[e.code]); break; }
    }
  }
  stopBusy();
  if (ids.length) {
    await putDoc("testes", testId, { profileId: p.id, data, analises: ids, status, criadoEm: new Date().toISOString() });
    for (const s of td.slots) if (s.url) URL.revokeObjectURL(s.url);
    S.testDraft = null;
    toast(status === "concluido" ? "Teste concluído." : "Teste salvo com as fotos analisadas até aqui.");
  }
  renderMain();
}

async function saveProc() {
  const f = S.procForm, p = profile(S.pid);
  if (!f || !p) return;
  if (!f.data) { toast("Informe a data do procedimento."); return; }
  try {
    await putDoc("eventos", newId(), { profileId: p.id, tipo: f.tipo, data: f.data, dias: Number(f.dias) || 0, area: f.area || "", obs: f.obs || "", criadoEm: new Date().toISOString() });
    S.procForm = null; toast("Procedimento registrado."); renderMain();
  } catch { toast("Não foi possível salvar. Tente de novo."); }
}

async function saveFeedback(id) {
  const f = S.fb; if (!f || f.id !== id) return;
  const { id: _, ...rest } = f;
  try { await patchDoc("analyses", id, { feedback: { ...rest, respondidoEm: new Date().toISOString() } }); toast("Respostas salvas."); }
  catch { toast("Não foi possível salvar as respostas."); }
}

    case "tab": S.tab = arg; S.confirm = null; if (arg !== "perfis") S.editProfile = null; render(); window.scrollTo({ top: 0 }); break;
    case "detail": S.detailId = arg; S.tab = "detalhe"; S.confirm = null; S.moveTo = ""; render(); window.scrollTo({ top: 0 }); break;
    case "period": S.period = arg; renderMain(); break;
    case "reg": ensureDraft().regiao = arg; renderMain(); break;
    case "tf": ensureDraft().tipoFoto = arg; renderMain(); break;
    case "force": S.draft.force = el.checked; renderMain(); break;
    case "clear-photo": if (S.draft?.url) URL.revokeObjectURL(S.draft.url); Object.assign(S.draft, { blob: null, url: null, q: null, force: false }); renderMain(); break;
    case "analisar": analisar(); break;
    case "parar": S.busy?.ctl.abort(); break;
    case "chk": toggleCheck(arg); break;
    case "p-new": S.tab = "perfis"; S.editProfile = { tipoPele: TIPOS[0], fototipo: FOTOTIPOS[0], objetivos: [], consentimento: false }; render(); break;
    case "p-edit": { const p = profile(arg); if (p) { S.tab = "perfis"; S.editProfile = JSON.parse(JSON.stringify(p)); render(); window.scrollTo({ top: 0 }); } break; }
    case "p-cancel": S.editProfile = null; renderMain(); break;
    case "p-del": case "a-del": case "e-del": case "t-del": S.confirm = act[0] + ":" + arg; renderMain(); break;
    case "cancel-confirm": S.confirm = null; renderMain(); break;
    case "p-del-yes": deleteProfile(arg); break;
    case "a-del-yes": deleteAnalysis(arg).then(() => { S.confirm = null; if (S.tab === "detalhe") S.tab = "evolucao"; toast("Análise excluída."); render(); }).catch(() => toast("Não foi possível excluir. Tente de novo.")); break;
    case "e-del-yes": delDoc("eventos", arg).then(() => { S.confirm = null; toast("Procedimento excluído."); renderMain(); }).catch(() => toast("Não foi possível excluir.")); break;
    case "t-del-yes": deleteTest(arg); break;
    case "proc-new": S.procForm = { tipo: PROCS[0][0], data: today(), dias: PROCS[0][1], area: "", obs: "" }; renderMain(); break;
    case "proc-cancel": S.procForm = null; renderMain(); break;
    case "rev-ok": patchDoc("analyses", arg, { revisao: null, revisaoConfirmada: new Date().toISOString() }).then(() => { toast("Análise confirmada e incluída na evolução."); renderMain(); }); break;
    case "rev-move": {
      const to = profile(S.moveTo); if (!to) break;
      patchDoc("analyses", arg, { profileId: to.id, revisao: null, comparadoCom: null, feedback: null }).then(() => { toast(`Análise movida para ${to.nome}.`); logOcorrencia(to.id, "foto movida", `Análise movida para ${to.nome}.`); S.moveTo = ""; S.pid = to.id; render(); });
      break;
    }
    case "fb": { const [k, v] = arg.split(/:(.*)/s); if (S.fb) { S.fb[k] = k === "entendeu" ? Number(v) : v; renderMain(); } break; }
    case "fb-save": saveFeedback(arg); break;
    case "slot-add": S.testDraft?.slots.push({ condicao: arg }); renderMain(); break;
    case "slot-del": { const s = S.testDraft?.slots[Number(arg)]; if (s?.url) URL.revokeObjectURL(s.url); S.testDraft?.slots.splice(Number(arg), 1); renderMain(); break; }
    case "run-test": runTest(); break;
    case "ask-sample": askSample(); break;
    case "enqueue-test": enqueueTest(); break;
    case "enqueue-one": enqueueOne(); break;
    case "copy-fila": copyText(PEDIDO_FILA, "Pedido copiado. Cole na conversa do Claude Code."); break;
    case "oc-add": { const t = S.noteDraft.trim(); if (!t) break; queued(() => putDoc("ocorrencias", newId(), { profileId: S.pid, tipo: "anotação", detalhe: t.slice(0, 500), criadoEm: new Date().toISOString(), auto: false })); S.noteDraft = ""; renderMain(); break; }
    case "oc-del": queued(() => delDoc("ocorrencias", arg)); break;

    case "copy-guide": copyText("Como tirar a foto para o MY Skin AI:\n" + GUIA.map((g, i) => `${i + 1}. ${g}`).join("\n"), "Guia copiado. Cole no WhatsApp da família."); break;

function copyText(text, ok) {
  if (!navigator.clipboard) { toast("Não deu para copiar. Selecione o texto e copie."); return; }
  navigator.clipboard.writeText(text).then(() => toast(ok), () => toast("Não deu para copiar. Selecione o texto e copie."));
}

document.addEventListener("change", (e) => {

function handleField(t) {
  if (t.dataset.d && S.draft) S.draft[t.dataset.d] = t.value;
  else if (t.dataset.ctx && S.draft) S.draft.ctx[t.dataset.ctx] = t.value;
  else if (t.dataset.pf && S.editProfile) S.editProfile[t.dataset.pf] = t.type === "checkbox" ? t.checked : t.value;
  else if (t.dataset.pr && S.procForm) S.procForm[t.dataset.pr] = t.value;
  else if (t.dataset.qz && S.editProfile) S.editProfile.quest = { ...(S.editProfile.quest || {}), [t.dataset.qz]: t.value };
  else if (t.dataset.fb && S.fb) S.fb[t.dataset.fb] = t.value;
  else if (t.dataset.fbn && S.fb) {
    const set = new Set(S.fb.notasErradas || []); t.checked ? set.add(t.dataset.fbn) : set.delete(t.dataset.fbn);
    S.fb.notasErradas = CATS.map(([k]) => k).filter((k) => set.has(k));
  }
  else if (t.dataset.obj && S.editProfile) {
    const set = new Set(S.editProfile.objetivos || []); t.checked ? set.add(t.dataset.obj) : set.delete(t.dataset.obj);
    S.editProfile.objetivos = OBJETIVOS.filter((o) => set.has(o));
  }
}

  if (!db) { S.runtime = "local"; pickProfile(); render(); return; }
  const ready = () => { if (S.loaded.p && S.loaded.a && S.runtime === "loading") { S.runtime = "db"; pickProfile(); render(); } else if (S.runtime === "db") onData(); };
  const fail = (e) => { if (e?.code === "revoked") toast("O acesso aos dados foi encerrado nesta visualização."); else toast("Falha ao carregar dados. Recarregue a página."); };
  const toRows = (q) => q.docs.map((d) => ({ id: d.id, ...d.data() }));
  db.collection("profiles").onSnapshot((q) => { S.profiles = toRows(q); S.loaded.p = true; ready(); }, fail);
  db.collection("analyses").onSnapshot((q) => { S.analyses = toRows(q); S.loaded.a = true; ready(); }, fail);
  for (const col of ["eventos", "testes", "ocorrencias", "fila"]) db.collection(col).onSnapshot((q) => { S[col] = toRows(q); ready(); }, fail);
  db.collection("checks").onSnapshot((q) => { const m = {}; q.docs.forEach((d) => { m[d.id] = d.data(); }); S.checks = m; if (S.runtime === "db" && S.tab === "rotina") renderMain(); }, fail);
})();
})();
</script>
