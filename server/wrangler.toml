name = "myskin-analise"
main = "src/index.js"
compatibility_date = "2026-09-01"

# o app web (pasta ../app) é servido pelo mesmo endereço; o que não é arquivo do app cai no Worker
[assets]
directory = "../app"

[vars]
# outras origens (separadas por vírgula) que podem chamar o servidor pelo navegador; o app em ../app não precisa, pois usa o mesmo endereço
ORIGENS_PERMITIDAS = ""

# até 10 análises por minuto por IP
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Segredos (não ficam aqui): npx wrangler secret put ANTHROPIC_API_KEY  e  npx wrangler secret put APP_TOKEN
